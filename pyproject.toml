[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cited-answers"
version = "0.1.0"
description = "A question-answering service over a help center: hybrid retrieval, cited answers or a fixed refusal, retrieval and answers graded apart."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = [
    "anthropic==2.3.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "httpx2",
]

[project.scripts]
cited = "cited_answers.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "D100", "D101", "D103", "D104"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"scripts/**" = ["D", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live and not integration'"
markers = [
    "integration: needs the Postgres with pgvector from docker-compose.yml (make up)",
    "e2e: the lesson's scenario end to end with the recorded model",
    "live: calls a real model; needs a key or a local server, run by `make test-live` only",
]

[tool.coverage.run]
source = ["cited_answers"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "cited_answers"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces on infrastructure on application on domain"
type = "layers"
layers = ["cited_answers.interfaces", "cited_answers.infrastructure", "cited_answers.application", "cited_answers.domain"]

[[tool.importlinter.contracts]]
name = "Domain and application never import a vendor SDK or an HTTP client"
type = "forbidden"
source_modules = ["cited_answers.domain", "cited_answers.application"]
forbidden_modules = ["anthropic", "httpx", "httpx2", "openai", "psycopg", "fastapi", "uvicorn"]
