<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="828" viewBox="0 0 1200 828" role="img" aria-labelledby="t d">
<title id="t">Architecture of the cited-answers service</title>
<desc id="d">A Reader calls interfaces.http, which calls AnswerService; the evaluation runner calls it too. AnswerService calls HybridRetriever, which searches Bm25Index in memory, embeds through the Embedder and runs vector search on the Chunk store in Postgres with pgvector. AnswerService sends the prompt to the ChatModel port and checks citations. A refusal goes back to the Reader in the warning tone. Offline, help pages pass through chunking, which skips three retired pages, into ingest, which embeds the chunks and writes them to the Chunk store.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="827" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="826" rx="16"/>
<text class="title" x="48" y="68">Cited answers over a help center</text>
<text class="caption" x="48" y="100">Ports keep the model, the embedder and the store replaceable. Nothing reaches the reader uncited.</text>

<rect class="actor" x="48" y="176" width="168" height="72" rx="36"/>
<text class="name" x="132" y="208" text-anchor="middle">Reader</text>
<text class="sub" x="132" y="230" text-anchor="middle">POST /ask</text>
<path class="store" d="M48 631a84 11 0 0 1 168 0v72a84 11 0 0 1 -168 0z"/>
<path class="rim" d="M48 631a84 11 0 0 0 168 0"/>
<text class="name" x="132" y="672" text-anchor="middle">Help pages</text>
<text class="sub" x="132" y="696" text-anchor="middle">data/pages: 60</text>
<rect class="boundary" x="264" y="132" width="588" height="612" rx="14"/>
<text class="tag" x="280" y="160">src/cited_answers: ports and adapters</text>
<rect class="svc" x="288" y="176" width="212" height="72" rx="12"/>
<text class="name" x="304" y="206">interfaces.http</text>
<text class="sub" x="304" y="230">POST /ask, /health</text>
<rect class="svc" x="288" y="276" width="212" height="92" rx="12"/>
<text class="name" x="304" y="304">evaluate</text>
<text class="sub" x="304" y="328">application.evaluate</text>
<text class="sub" x="304" y="350">application.judge</text>
<rect class="svc" x="580" y="176" width="248" height="192" rx="12"/>
<text class="name" x="596" y="206">AnswerService</text>
<text class="sub" x="596" y="230">application.answer</text>
<text class="sub" x="596" y="270">threshold 0.648</text>
<text class="sub" x="596" y="294">prompt answer/v2</text>
<text class="sub" x="596" y="318">check_citations()</text>
<rect class="svc" x="288" y="404" width="212" height="100" rx="12"/>
<text class="name" x="304" y="434">Bm25Index</text>
<text class="sub" x="304" y="458">in memory, top 20</text>
<text class="sub" x="304" y="480">built from the store</text>
<rect class="svc" x="580" y="412" width="248" height="84" rx="12"/>
<text class="name" x="596" y="444">HybridRetriever</text>
<text class="sub" x="596" y="468">application.retrieve</text>
<rect class="svc" x="580" y="528" width="248" height="72" rx="12"/>
<text class="name" x="596" y="556">Embedder</text>
<text class="sub" x="596" y="580">nomic-embed-text</text>
<text class="tag" x="288" y="584">offline: cited ingest</text>
<text class="label t-warn" x="288" y="612">3 retired pages skipped</text>
<rect class="svc" x="288" y="632" width="212" height="84" rx="12"/>
<text class="name" x="304" y="664">chunking</text>
<text class="sub" x="304" y="688">domain.chunking</text>
<rect class="svc" x="580" y="632" width="248" height="84" rx="12"/>
<text class="name" x="596" y="664">ingest</text>
<text class="sub" x="596" y="688">replace_all, atomically</text>
<rect class="svc" x="924" y="176" width="228" height="124" rx="12"/>
<text class="name" x="940" y="208">ChatModel</text>
<text class="sub" x="940" y="232">recorded by default</text>
<text class="sub" x="940" y="254">local server or Claude</text>
<text class="sub" x="940" y="276">retry with backoff</text>
<rect class="boundary" x="924" y="400" width="228" height="344" rx="14"/>
<text class="tag" x="936" y="428">Postgres 17 + pgvector</text>
<path class="store" d="M940 464a98 12 0 0 1 196 0v236a98 12 0 0 1 -196 0z"/>
<path class="rim" d="M940 464a98 12 0 0 0 196 0"/>
<text class="name" x="1038" y="540" text-anchor="middle">Chunk store</text>
<text class="sub" x="1038" y="566" text-anchor="middle">chunks table</text>
<text class="sub" x="1038" y="592" text-anchor="middle">68 chunks</text>
<text class="sub" x="1038" y="618" text-anchor="middle">vector(768)</text>
<text class="sub" x="1038" y="644" text-anchor="middle">status = current</text>
<path class="sync" d="M216 200H288"/>
<path class="fail" d="M288 232H212"/>
