<text class="label t-accent" x="860" y="500">top 20</text>
<path class="sync" d="M828 674H940"/>
<text class="label t-accent" x="860" y="664">write</text>
<path class="read" d="M216 672H288"/>
<path class="sync" d="M500 674H580"/>
<text class="label t-accent" x="510" y="664">chunks</text>

<path class="sync" d="M48 784H112"/><text class="legend" x="124" y="789">sync call</text>
<path class="read" d="M520 784H584"/><text class="legend" x="596" y="789">read</text>
<path class="fail" d="M696 784H760"/><text class="legend" x="772" y="789">failure path</text>
</svg>
