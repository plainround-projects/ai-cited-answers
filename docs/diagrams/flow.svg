<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img" aria-labelledby="t d">
<title id="t">One question through the cited-answers service, step by step</title>
<desc id="d">Seven numbered steps. POST /ask validates the question. HybridRetriever embeds it, takes 20 chunks by vector and 20 by BM25, and fuses them to five. If the best cosine is below 0.648 the reader gets the fixed refusal and the model is never called. Otherwise the ChatModel gets the five chunks, and the reply is checked in code. A refused reply, a reply with no citation or a citation that was not retrieved becomes the fixed refusal. Otherwise the reader gets the answer with its citations.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="787" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="786" rx="16"/>
<text class="title" x="48" y="68">One question, end to end</text>
<text class="caption" x="48" y="100">Two warning exits: refuse before the model when the match is weak, and refuse after it when a citation fails.</text>

<rect class="actor" x="398" y="128" width="124" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">POST /ask</text>
<rect class="svc" x="535" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">AnswerService</text>
<rect class="svc" x="695" y="128" width="170" height="48" rx="10"/>
<text class="lane" x="780" y="158" text-anchor="middle">HybridRetriever</text>
<rect class="svc" x="885" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="950" y="158" text-anchor="middle">Chunk store</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="158" text-anchor="middle">ChatModel</text>
<path class="hair" d="M460 176V704M610 176V704M780 176V380M950 176V312M1088 176V560"/>
<path class="hair" d="M66 216V680"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Validate the question</text>
<text class="sub" x="96" y="232">3 to 500 characters, no extras</text>
<path class="sync" d="M460 216H610"/>
<text class="label t-accent" x="472" y="206">ask(question)</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Search two ways</text>
<text class="sub" x="96" y="296">embed, then 20 by vector, 20 BM25</text>
<path class="sync" d="M610 280H780"/>
<text class="label t-accent" x="622" y="270">retrieve()</text>
<path class="sync" d="M780 280H950"/>
<text class="label t-accent" x="792" y="270">vector_search(20)</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Fuse the two lists</text>
<text class="sub" x="96" y="360">1 / (60 + rank), keep the top 5</text>
<rect class="slot" x="774" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="796" y="349">best cosine</text>
<path class="sync" d="M780 344H610"/>
<text class="label t-accent" x="622" y="334">5 chunks</text>
<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-warn" x="96" y="404">Below the threshold</text>
<text class="sub" x="96" y="424">the model is never called</text>
<path class="fail" d="M610 408H460"/>
<text class="label t-warn" x="472" y="398">best &lt; 0.648</text>
<text class="label t-warn" x="472" y="428">fixed refusal</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Prompt the model</text>
<text class="sub" x="96" y="488">five chunks, each under its id</text>
<path class="sync" d="M610 472H1088"/>
<text class="label t-accent" x="630" y="462">complete(): question + 5 chunks</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">Check the reply in code</text>
<text class="sub" x="96" y="552">every id cited, every id retrieved</text>
<path class="sync" d="M1088 536H610"/>
<text class="label t-accent" x="630" y="526">reply text</text>
<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6x</text>
<text class="label b t-warn" x="96" y="596">The check refuses</text>
<text class="sub" x="96" y="616">model_refused, no_citation, or</text>
<text class="sub" x="96" y="636">citation_not_retrieved</text>
<path class="fail" d="M610 600H460"/>
<text class="label t-warn" x="472" y="590">fixed refusal</text>
<circle class="dot-g" cx="66" cy="680" r="15"/><text class="num" x="66" y="685" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="676">Answer with citations</text>
<text class="sub" x="96" y="696">chunk id, page id, heading path</text>
<path class="ok" d="M610 680H460"/>
<text class="label t-good" x="472" y="670">status, answer</text>
<rect class="win" x="640" y="660" width="420" height="40" rx="10"/>
<text class="label b t-good" x="656" y="685">every claim cites a chunk a reader can open</text>

<path class="sync" d="M48 744H112"/><text class="legend" x="124" y="749">sync call</text>
<path class="fail" d="M696 744H760"/><text class="legend" x="772" y="749">failure path</text>
<path class="ok" d="M928 744H992"/><text class="legend" x="1004" y="749">result</text>
</svg>
